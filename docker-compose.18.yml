services:
  db18:
    image: postgres:15
    container_name: odoo18-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: odoo18
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg18data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d odoo18"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo18:
    image: odoo:18.0
    platform: linux/amd64
    container_name: odoo18-app
    depends_on:
      db18:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8070:8069"   # expón por otro puerto para convivir con 14
    volumes:
      - odoo18-data:/var/lib/odoo
      - ./config/odoo18.conf:/etc/odoo/odoo.conf:ro
      - ./custom_addons:/mnt/custom-addons
      - ./enterprise18/odoo/addons:/mnt/enterprise
    command: ["odoo", "-c", "/etc/odoo/odoo.conf", "--dev=xml,reload"]

volumes:
  pg18data:
  odoo18-data:
